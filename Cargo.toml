[package]
name = "nsmbw"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# The port (docs/PORT_PLAN.md) lives under crates/. `default-members` keeps a
# plain `cargo check` (and scripts/check.ps1) on the reconstruction only; build
# the port with `cargo run -p frontend`.
[workspace]
members = [".", "crates/frontend", "crates/guest-mem", "crates/guest-cpu", "crates/hle-ios", "crates/hw", "crates/hle-os", "crates/gx", "crates/vk-render", "crates/input", "crates/ppc-recomp", "crates/game-recomp", "crates/game-recomp/shards/*", "crates/port-update", "crates/launcher", "crates/android"]
default-members = ["."]

[profile.release]
panic = "abort"
# Thin: the recompiled code (crates/game-recomp) is too big for one fat-LTO
# module (21 minutes on one thread); thin LTO links it in parallel.
lto = "thin"

# Release without cross-crate LTO, for checks that only need the same
# results (the `--hash-every` script): after a change outside guest-cpu,
# guest-mem and the generated code it rebuilds in seconds instead of
# minutes, but runs about a third slower. Never measure speed with it.
# `cargo build --profile quick -p frontend` (output in target/quick).
[profile.quick]
inherits = "release"
lto = false

# Release plus debug info, for sampling profilers: `cargo build --profile profiling -p frontend`.
[profile.profiling]
inherits = "release"
debug = true
