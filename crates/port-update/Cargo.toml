[package]
name = "port-update"
# The port's release version: the launcher and the game compare this with the
# newest release's tag. Raise it when a release is cut.
version = "0.0.2"
edition = "2021"

[dependencies]
miniz_oxide = "0.8"
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
