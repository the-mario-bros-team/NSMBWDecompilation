[package]
name = "vk-render"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = "0.38"
egui = "0.36"
egui-ash-renderer = "0.13"
ash-window = "0.13"
raw-window-handle = "0.6"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
png = "0.18"
gx = { path = "../gx" }

[dev-dependencies]
guest-mem = { path = "../guest-mem" }
