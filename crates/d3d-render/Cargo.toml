[package]
name = "d3d-render"
version = "0.1.0"
edition = "2021"

# Direct3D 12 and Direct3D 11 renderers (Windows), next to vk-render's
# Vulkan one: the same `render::Backend`, the same WGSL ubershader turned
# into HLSL by naga and compiled by the system's d3dcompiler_47.
[dependencies]
render = { path = "../render" }
gx = { path = "../gx" }
egui = "0.36"
raw-window-handle = "0.6"
naga = { version = "30", features = ["wgsl-in", "hlsl-out"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
guest-mem = { path = "../guest-mem" }
