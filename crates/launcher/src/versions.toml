height = 0.27
amp = 0.060
rough = 0.0
width = 0.42
speed = 0.016

[[version.theme.scene.ridge]]
top = "#22a03c"
bottom = "#0a5a2a"
height = 0.15
amp = 0.050
rough = 0.0
width = 0.36
speed = 0.028

[[version]]
id = "newer"
title = "Newer Super Mario Bros. Wii"
short = "Newer"
tagline = "A fan-made adventure by the Newer Team"
playable = false
status = "The port's engine runs only the original USA disc's own code for now. Newer adds program code of its own on top of it, which the port cannot load yet."
discs = [{ id = "SMNE03", name = "Newer Super Mario Bros. Wii, USA" }]
with = ["files/NewerRes"]

[version.art]
logo = { archive = "files/US/Layout/openingTitle/openingTitle.arc", name = "" }
gallery = { archive = "files/Layout/textures/MultiCorseSelectTexture.arc", prefix = "im_W" }
banner = { file = "files/opening.bnr", hide = ["N_Left"] }

[version.theme]
