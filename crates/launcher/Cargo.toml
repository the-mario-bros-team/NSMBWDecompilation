[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nsmbw-launcher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
gilrs = "0.11"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22"
png = "0.18"
rfd = { version = "0.15", default-features = false }
gx = { path = "../gx" }
port-update = { path = "../port-update" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
